name: Build LTX 2.5 RunPod image

on:
  workflow_dispatch:
  push:
    branches: [ltx25-cached]
    paths:
      - Dockerfile.ltx25
      - worker_ltx25.py
      - requirements-ltx25.txt
      - .github/workflows/build-ltx25.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ltx25
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ltx25-runpod:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
